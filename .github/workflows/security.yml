name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC, to catch newly published advisories
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python, actions
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: codeql

  dependency-audit:
    name: Audit dependencies for known vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Audit what users install: the package and its optional runtime extras,
      # without the development tools.
      - name: Install package with runtime extras
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install ".[langchain,crewai,redis]"

      # Ignored advisories. Each one must name its source and why it can't be fixed here.
      # Review them whenever this job runs, and remove them once a fix ships.
      # - chromadb (pulled in by the optional crewai extra, not by ToolBoundary): no
      #   fixed release exists yet for CVE-2026-45829, CVE-2026-45830, CVE-2026-45831
      #   or CVE-2026-45833.
      - name: Run pip-audit
        run: |
          /tmp/audit/bin/python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit --path "$(/tmp/audit/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')" --desc \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

  static-analysis:
    name: Security lint (ruff flake8-bandit rules)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run the S (bandit) rule set on the library
        run: |
          pip install ruff
          ruff check src --select S --output-format=github

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
